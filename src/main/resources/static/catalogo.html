<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Catálogo de productos de ShopMaster">
    <title>Catálogo | ShopMaster</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>ShopMaster</h1>
        <nav aria-label="Navegación principal">
            <a href="index.html">Iniciar sesión</a>
        </nav>
    </header>

    <main>
        <h2>Nuestros productos</h2>
        <p id="estado-catalogo" role="status" aria-live="polite">Cargando productos...</p>
        <section id="catalogo" class="catalogo" aria-label="Lista de productos">
            <!-- Los productos se cargan desde /api/productos. -->
        </section>
    </main>

    <script src="js/catalogo.js"></script>

</body>
</html>
