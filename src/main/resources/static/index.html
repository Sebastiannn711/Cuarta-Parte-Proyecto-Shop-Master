<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - ShopMaster</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<h1>Iniciar Sesión - ShopMaster</h1>

<!-- El action apunta exacto a la placa del Servlet y viaja oculto por POST -->
<form action="ValidarIngreso" method="post">
    <fieldset>
        <div class="form_input">
            <label>INICIAR SESIÓN</label>
            <input type="text" placeholder="Nombre" name="campoUsuario" required>
            <input type="password" placeholder="Contraseña" name="campoContrasena" required>
        </div>
    </fieldset>

    <button type="submit">Entrar al sistema</button>
</form>

<br>
<a href="index.html">Volver a la vitrina comercial</a>

</body>
</html>
